name: CI

on: 
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'
  
permissions: read-all

defaults:
  run:
    shell: bash
    
jobs:
  build_and_test:
    runs-on: "ubuntu-latest"
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        container: [ubuntu:20.04, ubuntu:22.04, ubuntu:24.04, ubuntu:26.04]
        build_type: [Debug, Release]
        eigen: [true, false]
        cxx_standard: [11, 14, 17, 20, 23]
        exclude: # CXX23 is not supported in CMAKE 3.16 (in ubuntu:20.04)
          - container: ubuntu:20.04
            cxx_standard: 23

    steps:

    - name: dependencies_eigen
      if: ${{matrix.eigen}}
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt install cmake build-essential git libboost-filesystem-dev libeigen3-dev -y
        
    - name: dependencies_not_eigen
      if: ${{!matrix.eigen}}
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt install cmake build-essential git libboost-filesystem-dev -y
        
    - name: install yaml-cpp apt
      if: matrix.container != 'ubuntu:20.04'
      run: |
        apt-get update
        apt-get install libyaml-cpp-dev -y

    - name: install yaml-cpp source
      if: matrix.container == 'ubuntu:20.04'
      run: |
        git clone https://github.com/jbeder/yaml-cpp.git
        mkdir -pv yaml-cpp/build
        cd yaml-cpp/build
        cmake -DCMAKE_BUILD_TYPE=${{matrix.build_type}} -DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }} -DYAML_BUILD_SHARED_LIBS=ON -DYAML_CPP_BUILD_TESTS=OFF ..
        make -j2
        make install
        ldconfig
        
    - uses: actions/checkout@main
    
    - name: build
      run: |
        pwd
        ls
        mkdir -pv build
        cd build
        cmake -DCMAKE_CXX_STANDARD=${{ matrix.cxx_standard }} \
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
          -DBUILD_TESTS=ON ..
        make -j2
        ctest -j2 --output-on-failure

    - name: Tests
      run: |
        ctest --output-on-failure
